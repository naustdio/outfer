<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Closet</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#efe6d2" />
    <!-- AI-generated placeholder mark (hanger line-art) -- swap when a real
         brand identity exists. See public/icons/ for the PWA sizes. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!--
      Editorial visual design system: Libre Caslon Text (display/serif) for
      titles + Geist (UI sans) for everything else, both self-hosted via
      Google Fonts' CSS2 API. preconnect warms the two hosts CSS2 responses
      point at; font-display: swap is requested so text never blocks on the
      font file.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <!--
      Persistent bottom nav -- a sibling of #app, not a child of it, so the
      router's per-navigation `container.innerHTML = ""` (every screen does
      this; see src/ui/router.js's render()) never touches it. Starts
      `hidden` so there's no flash of nav chrome before src/main.js decides
      auth state (login screen vs. authenticated); src/main.js toggles the
      `hidden` attribute via the `nav` hook it passes to createApp
      (src/app.js). Content is rendered once by
      src/ui/components/nav-bar.js's renderNavBar().
    -->
    <nav id="app-nav" class="app-nav" hidden></nav>

    <!--
      public/config.js is per-deploy and gitignored (see
      public/config.example.js); it sets window.__CLOSET_APP_CONFIG__
      before src/main.js reads it. Safe to ship as a plain static file --
      the Supabase anon key is public by design (design.md: "the anon key
      is public in a static PWA -- a client-side gate protects nothing";
      RLS is the real boundary), unlike a service-role key which must
      never appear here.
    -->
    <script src="/config.js"></script>
    <!--
      Import map: remaps the bare specifier "@supabase/supabase-js" (used by
      src/data/supabaseClient.js) to a locally vendored ESM bundle instead of
      a CDN link, because:
        1. This PWA needs to eventually work offline (design.md) -- a CDN
           import map would add a runtime network dependency on every page
           load, defeating that goal.
        2. No bundler exists (design.md: vanilla ES modules, no build step),
           so the bare specifier is otherwise unresolvable in a browser.
        3. A browser import map can remap only ONE bare specifier per entry,
           not resolve a whole dependency tree of further bare imports, so
           the vendored file must be self-contained (see its own header
           comment for how it was built and verified).
      Do not swap this back to a CDN URL -- re-vendor
      public/vendor/supabase-js.esm.js when @supabase/supabase-js is
      upgraded in package.json instead.
    -->
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "/vendor/supabase-js.esm.js"
        }
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
