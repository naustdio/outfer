name: Deploy to Hostinger

# public/config.js lives only on the server (gitignored, never in this
# repo) -- the copy step below uses `cp -n` (no-clobber) so it's never
# touched by a deploy.
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e
            SITE="domains/slateblue-ostrich-755055.hostingersite.com/public_html"
            cd "$SITE/repo"
            git fetch origin master
            git reset --hard origin/master
            rsync -a --delete --exclude 'config.js' --exclude 'config.example.js' --exclude 'repo' public/ ../
            rsync -a --delete --exclude 'repo' src/ ../src/
            printf "Require all denied\n" > .htaccess
            echo "Deployed $(git rev-parse --short HEAD)"
